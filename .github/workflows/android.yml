name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        shell: bash
        run: |
          if [ ! -d android ]; then
            mkdir -p .ci/flutter_template
            flutter create --no-pub --platforms=android               --org com.tomasthrawat               --project-name hyouka_messages               .ci/flutter_template
            cp -R .ci/flutter_template/android ./android
            cp .ci/flutter_template/.metadata ./.metadata
            cp .ci/flutter_template/.gitignore ./.gitignore
          fi

      - name: Configure native SMS integration
        run: python3 tool/configure_android.py

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run widget tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Show APK outputs
        shell: bash
        run: |
          find build/app/outputs/flutter-apk -maxdepth 1 -type f -name '*.apk' -print -exec ls -lh {} \;

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: hyouka-messages-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
