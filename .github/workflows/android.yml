name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        shell: bash
        run: |
          git clone --depth 1 --branch main "https://github.com/${GITHUB_REPOSITORY}.git" .

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        shell: bash
        run: |
          if [ ! -d android ]; then
            mkdir -p .ci/flutter_template
            git config --global init.defaultBranch main
            flutter create --no-pub --platforms=android               --org com.messages               --project-name chat               .ci/flutter_template
            cp -R .ci/flutter_template/android ./android
            cp .ci/flutter_template/.metadata ./.metadata
            cp .ci/flutter_template/.gitignore ./.gitignore
          fi

          printf '\norg.gradle.vfs.watch=false\n' >> android/gradle.properties

      - name: Configure native SMS integration
        run: python3 tool/configure_android.py

      - name: Finalize Android identity and ABI
        run: python3 tool/finalize_android.py

      - name: Configure Messages launcher icon
        run: python3 tool/configure_icon.py

      - name: Verify native SMS notifications
        shell: bash
        run: |
          SRC="android/app/src/main/kotlin/com/messages/chat"
          test -f "$SRC/SmsReceiver.kt"
          test -f "$SRC/SmsNotificationHelper.kt"
          grep -q 'android.permission.POST_NOTIFICATIONS' android/app/src/main/AndroidManifest.xml
          grep -q 'SMS_DELIVER' "$SRC/SmsReceiver.kt"
          grep -q 'showIncomingMessage' "$SRC/SmsReceiver.kt"
          echo "Verified: incoming SMS notification integration is present."

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run widget tests
        run: flutter test

      - name: Build release APK (arm64-v8a only)
        run: flutter build apk --release --target-platform android-arm64

      - name: Show and verify APK outputs
        shell: bash
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -f "$APK"
          find build/app/outputs/flutter-apk -maxdepth 1 -type f -name '*.apk' -print -exec ls -lh {} \;

          ABIS="$(unzip -Z1 "$APK" | awk -F/ '$1 == "lib" && $2 != "" {print $2}' | sort -u)"
          printf 'Native ABIs in APK:\n%s\n' "$ABIS"
          test "$ABIS" = "arm64-v8a"
          echo "Verified: APK contains only arm64-v8a native libraries."

      - name: Verify application identity
        shell: bash
        run: |
          grep -R 'applicationId\|namespace' android/app/build.gradle* | head -20
          grep -n 'android:label' android/app/src/main/AndroidManifest.xml

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: hyouka-messages-release-apk-arm64-v8a
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Send successful APK to Telegram
        if: ${{ success() }}
        env:
          HYOUKA_BUILD_WEBHOOK: https://hyouka-http-mcp.vercel.app/api/telegram-build
          GITHUB_ACTION_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          payload=$(cat <<JSON
          {"owner":"TomasThrawat","repo":"${{ github.event.repository.name }}","runId":${{ github.run_id }},"artifactName":"hyouka-messages-release-apk-arm64-v8a","sha":"${{ github.sha }}"}
          JSON
          )
          for attempt in 1 2 3; do
            if curl --fail-with-body --silent --show-error --request POST \
              --header "Authorization: Bearer $GITHUB_ACTION_TOKEN" \
              --header "Content-Type: application/json" \
              --data "$payload" \
              "$HYOUKA_BUILD_WEBHOOK"
            then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 5))
            fi
          done
          exit 1
