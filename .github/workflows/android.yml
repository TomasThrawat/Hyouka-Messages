name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        shell: bash
        run: |
          if [ ! -d android ]; then
            mkdir -p .ci/flutter_template
            flutter create --no-pub --platforms=android               --org com.messages               --project-name chat               .ci/flutter_template
            cp -R .ci/flutter_template/android ./android
            cp .ci/flutter_template/.metadata ./.metadata
            cp .ci/flutter_template/.gitignore ./.gitignore
          fi

          printf '\norg.gradle.vfs.watch=false\n' >> android/gradle.properties

      - name: Configure native SMS integration
        run: python3 tool/configure_android.py

      - name: Finalize Android identity and ABI
        run: python3 tool/finalize_android.py

      - name: Configure Messages launcher icon
        run: python3 tool/configure_icon.py

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run widget tests
        run: flutter test

      - name: Build release APK (arm64-v8a only)
        run: flutter build apk --release --target-platform android-arm64

      - name: Show and verify APK outputs
        shell: bash
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -f "$APK"
          find build/app/outputs/flutter-apk -maxdepth 1 -type f -name '*.apk' -print -exec ls -lh {} \;

          ABIS="$(unzip -Z1 "$APK" | awk -F/ '$1 == "lib" && $2 != "" {print $2}' | sort -u)"
          printf 'Native ABIs in APK:\n%s\n' "$ABIS"
          test "$ABIS" = "arm64-v8a"
          echo "Verified: APK contains only arm64-v8a native libraries."

      - name: Verify application identity
        shell: bash
        run: |
          grep -R 'applicationId\|namespace' android/app/build.gradle* | head -20
          grep -n 'android:label' android/app/src/main/AndroidManifest.xml

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: hyouka-messages-release-apk-arm64-v8a
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
